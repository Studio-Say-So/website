name = "studiosayso-forms"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Secrets (set with `wrangler secret put <NAME>`, never commit):
#   TURNSTILE_SECRET  - Cloudflare Turnstile secret key
#   RESEND_API_KEY    - or whatever mail provider is chosen
#   META_CAPI_TOKEN   - Meta Conversions API access token; without it the
#                       server-side Lead event is skipped and mail still sends
#
# vars:
#   NOTIFY_TO   - address that receives submissions
#   NOTIFY_FROM - verified sender address
#   ALLOWED_ORIGIN - the site origin allowed to POST here
#   META_PIXEL_ID  - same pixel as the GTM tag, for Conversions API events
# Served from the site's own origin so the form POST is same-origin: no
# preflight, and ALLOWED_ORIGIN can never drift from where the page is served.
# Cloudflare already proxies this zone, so the route works before DNS cutover.
routes = [
  { pattern = "studiosayso.com/api/form*", zone_name = "studiosayso.com" }
]

# Deploys need an account: the login can see several.
#   CLOUDFLARE_ACCOUNT_ID=14fc121ee1000fbf9186fb88b7ae36cc npx wrangler deploy

[vars]
ALLOWED_ORIGIN = "https://studiosayso.com"
META_PIXEL_ID = "688292446778861"
# NOTIFY_FROM must sit on the Resend-verified domain; replies go to the enquirer.
# NOTIFY_TO is a secret, not a var: this repo is public and it is a real inbox.
NOTIFY_FROM = "Studio Say So <forms@send.studiosayso.com>"
